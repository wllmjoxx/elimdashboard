; Background processes for GGP Elim. provision.sh fills in __APP_DIR__ and
; __APP_USER__ and installs this as /etc/supervisor/conf.d/elim.conf.

[program:elim-queue]
command=php __APP_DIR__/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=__APP_DIR__
user=__APP_USER__
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stdout_logfile=__APP_DIR__/storage/logs/queue.log
redirect_stderr=true

; Server-side rendering (config/inertia.php has SSR on). Restarted by
; deploy.sh with `php artisan inertia:stop-ssr`.
[program:elim-ssr]
command=php __APP_DIR__/artisan inertia:start-ssr
directory=__APP_DIR__
user=__APP_USER__
autostart=true
autorestart=true
stdout_logfile=__APP_DIR__/storage/logs/ssr.log
redirect_stderr=true
