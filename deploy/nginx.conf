# Nginx site for GGP Elim. provision.sh fills in __DOMAIN__, __APP_DIR__ and
# __PHP__; certbot then adds the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    # Video uploads for the homepage (Landing › Video & Live) up to 50 MB.
    client_max_body_size 64m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets have hashed names: cache them for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /storage/ {
        expires 7d;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHP__-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }
}
